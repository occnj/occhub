{% extends "base.html" %}
{% block title %}About{% endblock %}
{% block head %}<style>.about-body{font-size:0.9rem;line-height:1.85;color:var(--text2);white-space:pre-line;}</style>{% endblock %}
{% block content %}
<div class="hero">
  <a href="/hub" class="back-btn"><i class="bi bi-arrow-left"></i></a>
  {% if settings.about_hero %}<img src="/static/{{ settings.about_hero }}" alt="" class="hero-img"><div class="hero-overlay"></div>{% endif %}
  <div class="hero-content indent"><div class="hero-tag">Oasis Christian Centre</div><div class="hero-title">{{ settings.about_title or 'About Oasis' }}</div></div>
</div>
<div class="body"><div class="card"><div class="card-body"><div class="about-body">{{ settings.about_body or '' }}</div></div></div></div>
{% endblock %}
