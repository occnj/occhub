<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="{{ site_settings.get('theme_primary', '#13677A') }}">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Oasis Hub">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js')})}</script>
<script defer src="/static/reveal.js?v=2"></script>
<link rel="stylesheet" href="/static/transitions.css?v=1">
<title>About — Oasis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="icon" type="image/png" href="/static/icon-192x192.png">
<style>
:root{--teal:{{ site_settings.get('theme_primary', '#13677A') }};--orange:{{ site_settings.get('theme_accent', '#F2541B') }};--bg:{{ site_settings.get('theme_background', '#F5F5F7') }};--card:{{ site_settings.get('theme_card', '#ffffff') }};--text:{{ site_settings.get('theme_text', '#1d1d1f') }};--sub:{{ site_settings.get('theme_subtext', '#6e6e73') }};}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);{% if site_settings.get('ui_background_image') %}background-image:url('/static/{{ site_settings.get('ui_background_image') }}');background-size:cover;background-position:center;background-attachment:fixed;{% endif %}font-family:'DM Sans',sans-serif;color:var(--text);display:flex;justify-content:center;min-height:100vh;padding-bottom:48px;}
.shell{width:100%;max-width:390px;}
.back-btn{position:absolute;top:56px;left:20px;color:#fff;font-size:1rem;text-decoration:none;width:38px;height:38px;display:flex;align-items:center;justify-content:center;z-index:2;background:#f05123;border-radius:12px;box-shadow:0 10px 24px rgba(240,81,35,0.28);}
.hero{position:relative;min-height:220px;overflow:hidden;background:linear-gradient(150deg,#0f4250 0%,#13677A 55%,#f05123 100%);border-radius:28px;margin:16px 16px 0;box-shadow:0 10px 30px rgba(0,0,0,0.08);}
.hero::after{content:"";position:absolute;inset:auto -40px -60px auto;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,0.08);filter:blur(2px);pointer-events:none;}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.35;}
.hero-content{position:relative;z-index:1;padding:56px 24px 28px 78px;}
.hero-tag{font-size:0.65rem;letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,255,255,0.55);margin-bottom:6px;}
.hero-title{font-family:'DM Serif Display',serif;font-size:2.2rem;color:white;line-height:1.2;}
.hero-copy{font-size:0.9rem;line-height:1.65;color:rgba(255,255,255,0.78);max-width:250px;margin-top:10px;}
.body{padding:24px 16px;}
.card{background:var(--card);border-radius:20px;padding:24px 20px;box-shadow:0 1px 5px rgba(0,0,0,0.06);}
.card-body{font-size:0.9rem;line-height:1.8;color:#3a3a3c;white-space:pre-line;}
</style>
</head>
<body>
<div class="shell">
  <div class="hero">
    <a href="/hub" class="back-btn"><i class="bi bi-arrow-left"></i></a>
    {% if settings.about_hero %}
    <img src="/static/{{ settings.about_hero }}" alt="" class="hero-img">
    {% endif %}
    <div class="hero-content">
      <div class="hero-tag">Oasis Christian Centre</div>
      <div class="hero-title">{{ settings.about_title or 'About Oasis' }}</div>
      <div class="hero-copy">{{ settings.get('about_page_description') or 'Get to know the heart, story, and vision behind Oasis.' }}</div>
    </div>
  </div>
  <div class="body">
    <div class="card">
      <div class="card-body">{{ settings.about_body or '' }}</div>
    </div>
  </div>
</div>
{% include '_primary_cta.html' %}
</body></html>
