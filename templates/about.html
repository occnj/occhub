<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>About — Oasis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#13677A">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Oasis Hub">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="/static/icon-192x192.png">
<style>
:root{--teal:#13677A;--orange:#F2541B;--bg:#F5F5F7;--card:#fff;--text:#1d1d1f;--sub:#6e6e73;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);display:flex;justify-content:center;min-height:100vh;padding-bottom:48px;}
.shell{width:100%;max-width:390px;}
.back-btn{position:absolute;top:56px;left:20px;color:rgba(255,255,255,0.85);font-size:1.2rem;text-decoration:none;width:32px;height:32px;display:flex;align-items:center;justify-content:center;z-index:2;}
.hero{position:relative;background:var(--teal);min-height:220px;overflow:hidden;}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.35;}
.hero-content{position:relative;z-index:1;padding:56px 24px 28px 60px;}
.hero-tag{font-size:0.65rem;letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,255,255,0.55);margin-bottom:6px;}
.hero-title{font-family:'DM Serif Display',serif;font-size:2.2rem;color:white;line-height:1.2;}
.body{padding:24px 16px;}
.card{background:var(--card);border-radius:20px;padding:24px 20px;box-shadow:0 1px 5px rgba(0,0,0,0.06);}
.card-body{font-size:0.9rem;line-height:1.8;color:#3a3a3c;white-space:pre-line;}
</style>
</head>
<body>
<div class="shell">
  <div class="hero">
    <a href="/hub" class="back-btn"><i class="bi bi-chevron-left"></i></a>
    {% if settings.about_hero %}
    <img src="/static/{{ settings.about_hero }}" alt="" class="hero-img">
    {% endif %}
    <div class="hero-content">
      <div class="hero-tag">Oasis Christian Centre</div>
      <div class="hero-title">{{ settings.about_title or 'About Oasis' }}</div>
    </div>
  </div>
  <div class="body">
    <div class="card">
      <div class="card-body">{{ settings.about_body or '' }}</div>
    </div>
  </div>
</div>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(e => console.log('SW error:', e));
  });
}
</script>
</body></html>
