{% extends "admin/base.html" %}
{% block title %}Get Involved{% endblock %}
{% block page_title %}Get Involved{% endblock %}
{% block page_sub %}The card shown under Today's Message on the Hub — tapping it opens the full details{% endblock %}

{% block content %}
<form method="POST">
  <div style="max-width:560px;">
    <div class="card">
      <div class="card-header"><div class="card-title"><i class="bi bi-people-fill"></i> Card Content</div></div>
      <div class="card-body">
        <div class="form-group">
          <label style="display:flex;align-items:center;gap:10px;cursor:pointer;font-size:0.88rem;font-weight:600;text-transform:none;letter-spacing:0;">
            <input type="checkbox" name="get_involved_enabled" value="1" {% if settings.get('get_involved_enabled') == '1' %}checked{% endif %} style="accent-color:#13677A;width:16px;height:16px;">
            Show Get Involved card on the Hub
          </label>
        </div>
        <div class="form-group">
          <label class="form-label">Title</label>
          <input type="text" name="get_involved_title" class="form-control" value="{{ settings.get('get_involved_title', '') }}" placeholder="Serve at the Fall Outreach">
        </div>
        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea name="get_involved_body" class="form-control" style="min-height:180px;" placeholder="Describe the event or opportunity. Shown in the popup when the card is tapped.">{{ settings.get('get_involved_body', '') }}</textarea>
        </div>
        <div style="display:grid;grid-template-columns:1fr 220px;gap:16px;">
          <div class="form-group">
            <label class="form-label">Button Link</label>
            <input type="url" name="get_involved_link" class="form-control" value="{{ settings.get('get_involved_link', '') }}" placeholder="https://...">
          </div>
          <div class="form-group">
            <label class="form-label">Button Label</label>
            <input type="text" name="get_involved_link_label" class="form-control" value="{{ settings.get('get_involved_link_label', 'Sign Up') }}" placeholder="Sign Up">
          </div>
        </div>
      </div>
    </div>

  </div>

  <div style="position:sticky;bottom:16px;margin-top:20px;">
    <button type="submit" class="btn btn-primary" style="width:100%;padding:16px;font-size:1rem;">Save Get Involved</button>
  </div>
</form>
{% endblock %}
