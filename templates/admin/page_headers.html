{% extends "admin/base.html" %}
{% block title %}Page Headers{% endblock %}
{% block page_title %}Page Headers{% endblock %}
{% block page_sub %}Edit the description shown under each public page title{% endblock %}

{% block content %}
<form method="POST">
  <div class="card">
    <div class="card-header">
      <div class="card-title"><i class="bi bi-type"></i> Header Descriptions</div>
    </div>
    <div class="card-body">
      <div class="form-group"><label class="form-label">About</label><textarea name="about_page_description" class="form-control" style="min-height:88px;">{{ settings.get('about_page_description', '') }}</textarea></div>
      <div class="form-group"><label class="form-label">Beliefs</label><textarea name="beliefs_page_description" class="form-control" style="min-height:88px;">{{ settings.get('beliefs_page_description', '') }}</textarea></div>
      <div class="form-group"><label class="form-label">Values</label><textarea name="values_page_description" class="form-control" style="min-height:88px;">{{ settings.get('values_page_description', '') }}</textarea></div>
      <div class="form-group"><label class="form-label">Events</label><textarea name="calendar_page_description" class="form-control" style="min-height:88px;">{{ settings.get('calendar_page_description', '') }}</textarea></div>
      <div class="form-group"><label class="form-label">Connect</label><textarea name="connect_page_description" class="form-control" style="min-height:88px;">{{ settings.get('connect_page_description', '') }}</textarea></div>
      <div class="form-group"><label class="form-label">Contact</label><textarea name="contact_page_description" class="form-control" style="min-height:88px;">{{ settings.get('contact_page_description', '') }}</textarea></div>
      <div class="form-group"><label class="form-label">Leadership</label><textarea name="leadership_page_description" class="form-control" style="min-height:88px;">{{ settings.get('leadership_page_description', '') }}</textarea></div>
      <div class="form-group"><label class="form-label">Mission</label><textarea name="mission_page_description" class="form-control" style="min-height:88px;">{{ settings.get('mission_page_description', '') }}</textarea></div>
      <div class="form-group"><label class="form-label">Ministries</label><textarea name="ministries_page_description" class="form-control" style="min-height:88px;">{{ settings.get('ministries_page_description', '') }}</textarea></div>
      <div class="form-group"><label class="form-label">Prayer</label><textarea name="prayer_page_description" class="form-control" style="min-height:88px;">{{ settings.get('prayer_page_description', '') }}</textarea></div>
      <div class="form-group"><label class="form-label">Serve</label><textarea name="serve_page_description" class="form-control" style="min-height:88px;">{{ settings.get('serve_page_description', '') }}</textarea></div>
      <div class="form-group"><label class="form-label">Social</label><textarea name="social_page_description" class="form-control" style="min-height:88px;">{{ settings.get('social_page_description', '') }}</textarea></div>
      <div class="form-group"><label class="form-label">Watch The Latest</label><textarea name="watch_page_description" class="form-control" style="min-height:88px;">{{ settings.get('watch_page_description', '') }}</textarea></div>
      <div class="form-group"><label class="form-label">Sermon Notes</label><textarea name="sermon_notes_page_description" class="form-control" style="min-height:88px;">{{ settings.get('sermon_notes_page_description', '') }}</textarea></div>
      <div class="form-group" style="margin-bottom:0;"><label class="form-label">Oasis Crew</label><textarea name="crew_page_description" class="form-control" style="min-height:88px;">{{ settings.get('crew_page_description', '') }}</textarea></div>
    </div>
  </div>

  <div style="position:sticky;bottom:16px;margin-top:20px;">
    <button type="submit" class="btn btn-primary" style="width:100%;padding:16px;font-size:1rem;">Save Page Headers</button>
  </div>
</form>
{% endblock %}
