{% extends "admin/base.html" %}
{% block title %}Change Password{% endblock %}
{% block page_title %}Change Password{% endblock %}
{% block page_sub %}Admin credentials{% endblock %}

{% block content %}
<div class="card" style="max-width:400px;">
    <div class="card-header"><div class="card-title">Update Password</div></div>
    <div class="card-body">
        <form method="POST">
            <div class="form-group">
                <label class="form-label">Current Password</label>
                <input type="password" name="current_password" class="form-control" required autocomplete="current-password" placeholder="Enter current password">
            </div>
            <div class="form-group">
                <label class="form-label">New Password</label>
                <input type="password" name="new_password" class="form-control" required minlength="10" autocomplete="new-password" placeholder="At least 10 characters">
            </div>
            <button type="submit" class="btn btn-primary">Update Password</button>
        </form>
    </div>
</div>
{% endblock %}
