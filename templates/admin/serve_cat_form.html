{% extends "admin/base.html" %}
{% block title %}Edit Category{% endblock %}
{% block page_title %}Edit Serve Category{% endblock %}
{% block topbar_actions %}<a href="{{ url_for('admin_serve') }}" class="btn btn-ghost"><i class="bi bi-arrow-left"></i> Back</a>{% endblock %}
{% block content %}
<div class="card" style="max-width:480px;">
  <div class="card-header"><div class="card-title">Edit: {{ cat.name }}</div></div>
  <div class="card-body">
    <form method="POST">
      <div class="form-group">
        <label class="form-label">Category Name</label>
        <input type="text" name="name" class="form-control" value="{{ cat.name }}" required>
      </div>
      <div class="form-group">
        <label class="form-label">Bootstrap Icon Class</label>
        <input type="text" name="icon" class="form-control" value="{{ cat.icon }}">
        <div style="font-size:0.72rem;color:#6e6e73;margin-top:5px;">Browse at <a href="https://icons.getbootstrap.com" target="_blank" style="color:#13677A;">icons.getbootstrap.com</a></div>
      </div>
      <div class="form-group">
        <label class="form-label">Color</label>
        <select name="color" class="form-control">
          <option value="teal" {% if cat.color=='teal' %}selected{% endif %}>Teal</option>
          <option value="orange" {% if cat.color=='orange' %}selected{% endif %}>Orange</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Display Order</label>
        <input type="number" name="sort_order" class="form-control" value="{{ cat.sort_order }}" style="width:120px;">
      </div>
      <div style="display:flex;gap:10px;margin-top:8px;">
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{{ url_for('admin_serve') }}" class="btn btn-ghost">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
