{% extends "admin/base.html" %}
{% block title %}New User{% endblock %}
{% block page_title %}Add Admin User{% endblock %}
{% block topbar_actions %}<a href="{{ url_for('admin_users') }}" class="btn btn-ghost"><i class="bi bi-arrow-left"></i> Back</a>{% endblock %}
{% block content %}
<div class="card" style="max-width:440px;">
  <div class="card-body">
    <form method="POST">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" required placeholder="e.g. pastor.john" autocomplete="off">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required placeholder="Min 6 characters" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label class="form-label">Role</label>
        <select name="role" class="form-control">
          <option value="editor">Editor — can manage content</option>
          <option value="superadmin">Superadmin — full access + users</option>
        </select>
      </div>
      <div style="display:flex;gap:10px;margin-top:8px;">
        <button type="submit" class="btn btn-primary">Create User</button>
        <a href="{{ url_for('admin_users') }}" class="btn btn-ghost">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
