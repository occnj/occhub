<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beliefs — Oasis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="icon" type="image/png" href="/static/icon-192x192.png">
    <style>
        :root { --teal: {{ site_settings.get('theme_primary', '#13677A') }}; --orange: {{ site_settings.get('theme_accent', '#F2541B') }}; --bg: {{ site_settings.get('theme_background', '#F5F5F7') }}; --card: {{ site_settings.get('theme_card', '#ffffff') }}; --text: {{ site_settings.get('theme_text', '#1d1d1f') }}; --sub: {{ site_settings.get('theme_subtext', '#6e6e73') }}; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); {% if site_settings.get('ui_background_image') %}background-image: url('/static/{{ site_settings.get('ui_background_image') }}'); background-size: cover; background-position: center; background-attachment: fixed;{% endif %} font-family: 'DM Sans', sans-serif; color: var(--text); display: flex; justify-content: center; min-height: 100vh; padding-bottom: 40px; }
        .shell { width: 100%; max-width: 390px; }
        .hero { background: linear-gradient(150deg,#0f4250 0%,#13677A 55%,#f05123 100%); padding: 56px 24px 28px; position: relative; overflow:hidden; }
        .hero::after { content:""; position:absolute; inset:auto -40px -60px auto; width:200px; height:200px; border-radius:50%; background:rgba(255,255,255,0.08); filter:blur(2px); pointer-events:none; }
        .back-btn { position: absolute; top: 56px; left: 20px; color: #fff; font-size: 1rem; text-decoration: none; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; background: #f05123; border-radius: 12px; box-shadow: 0 10px 24px rgba(240,81,35,0.28); z-index:2; }
        .hero-content { position: relative; z-index: 1; padding-left: 58px; }
        .hero-tag { font-size: 0.65rem; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.5); margin-bottom: 6px; }
        .hero-title { font-family: 'DM Serif Display', serif; font-size: 2rem; color: white; }
        .hero-copy { font-size: 0.9rem; line-height: 1.65; color: rgba(255,255,255,0.78); max-width: 250px; margin-top: 10px; }
        .list { padding: 20px 16px; display: flex; flex-direction: column; gap: 10px; }
        .row { background: var(--card); border-radius: 16px; padding: 18px 16px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.05); transition: transform 0.15s; border: none; width: 100%; text-align: left; }
        .row:active { transform: scale(0.98); }
        .row-left { display: flex; align-items: center; gap: 14px; }
        .row-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--orange); flex-shrink: 0; }
        .row-label { font-size: 0.88rem; font-weight: 600; color: var(--text); }
        .row-chevron { color: #c7c7cc; font-size: 0.75rem; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .overlay.open { opacity: 1; pointer-events: all; }
        .sheet { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%) translateY(100%); width: 100%; max-width: 390px; background: var(--card); border-radius: 24px 24px 0 0; z-index: 101; padding: 0 0 40px; max-height: 85vh; overflow-y: auto; transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .sheet.open { transform: translateX(-50%) translateY(0); }
        .sheet-handle { width: 36px; height: 4px; background: #e0e0e5; border-radius: 4px; margin: 12px auto 20px; }
        .sheet-header { padding: 0 22px 16px; border-bottom: 1px solid #f0f0f5; }
        .sheet-title { font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--orange); font-weight: 600; margin-bottom: 4px; }
        .sheet-name { font-family: 'DM Serif Display', serif; font-size: 1.5rem; color: var(--text); }
        .gallery-shell{background:var(--card);border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,0.08);overflow:hidden;margin:16px 0 18px;}
        .gallery-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;}
        .gallery-track::-webkit-scrollbar{display:none;}
        .slide{min-width:100%;scroll-snap-align:start;}
        .slide img{width:100%;height:220px;object-fit:cover;display:block;}
        .slide-caption{padding:12px 14px 14px;font-size:0.82rem;color:var(--sub);line-height:1.6;}
        .gallery-actions{display:flex;gap:10px;padding:0 14px 12px;}
        .gallery-btn{flex:1;border:none;background:rgba(19,103,122,0.08);color:var(--teal);border-radius:14px;padding:10px 14px;font-family:'DM Sans',sans-serif;font-size:0.82rem;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;}
        .gallery-count{font-size:0.72rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--sub);text-align:center;padding:0 0 14px;}
        .sheet-body { padding: 20px 22px 0; font-size: 0.9rem; line-height: 1.7; color: #3a3a3c; }
        .scripture-box { background: rgba(19,103,122,0.06); border-left: 3px solid var(--teal); border-radius: 0 10px 10px 0; padding: 10px 14px; margin-top: 18px; font-size: 0.76rem; color: var(--teal); font-weight: 500; line-height: 1.5; }
        .sheet-close { position: absolute; top: 14px; right: 18px; background: #f0f0f5; border: none; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.8rem; color: var(--sub); }
    </style>
</head>
<body>
<div class="shell">
    <div class="hero">
        <a href="{{ url_for('hub') }}" class="back-btn"><i class="bi bi-arrow-left"></i></a>
        <div class="hero-content">
            <div class="hero-tag">Oasis Christian Centre</div>
            <div class="hero-title">Beliefs</div>
            <div class="hero-copy">{{ settings.get('beliefs_page_description') or 'The heart, truth, and biblical foundation that shape who we are as a church.' }}</div>
        </div>
    </div>
    <div class="list">
        {% for b in beliefs %}
        <button class="row" onclick="openSheet({{ loop.index0 }})">
            <div class="row-left"><div class="row-dot"></div><div class="row-label">{{ b.title }}</div></div>
            <i class="bi bi-chevron-right row-chevron"></i>
        </button>
        {% endfor %}
    </div>
</div>

<div class="overlay" id="overlay" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
    <button class="sheet-close" onclick="closeSheet()"><i class="bi bi-x"></i></button>
    <div class="sheet-handle"></div>
    <div class="sheet-header">
        <div class="sheet-title">Beliefs</div>
        <div class="sheet-name" id="sheet-name"></div>
    </div>
    <div class="gallery-shell" id="gallery-shell" style="display:none;">
        <div class="gallery-track" id="gallery-track"></div>
        <div class="gallery-actions">
            <button class="gallery-btn" type="button" onclick="moveGallery(-1)"><i class="bi bi-arrow-left"></i> Prev</button>
            <button class="gallery-btn" type="button" onclick="moveGallery(1)">Next <i class="bi bi-arrow-right"></i></button>
        </div>
        <div class="gallery-count"><span id="gallery-index">1</span> / <span id="gallery-total">0</span></div>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
</div>

<script>
const beliefs = [
    {% for b in beliefs %}
    {
      title: {{ b.title | tojson }},
      body: {{ (b.body or '') | tojson }},
      ref: {{ (b.scripture or '') | tojson }},
      images: [
        {% for img in belief_images.get(b.id, []) %}
        { photo: {{ ('/static/' ~ img.photo) | tojson }}, caption: {{ (img.caption or '') | tojson }} }{% if not loop.last %},{% endif %}
        {% endfor %}
      ]
    }{% if not loop.last %},{% endif %}
    {% endfor %}
];
let currentGallery = [];
function openSheet(i) {
    const b = beliefs[i];
    document.getElementById('sheet-name').textContent = b.title;
    currentGallery = b.images || [];
    renderGallery();
    const body = document.getElementById('sheet-body');
    body.innerHTML = b.body.split('\n\n').map(p => `<p style="margin-bottom:14px">${p}</p>`).join('') +
        (b.ref ? `<div class="scripture-box">${b.ref}</div>` : '');
    document.getElementById('overlay').classList.add('open');
    document.getElementById('sheet').classList.add('open');
}
function renderGallery() {
    const shell = document.getElementById('gallery-shell');
    const track = document.getElementById('gallery-track');
    const total = document.getElementById('gallery-total');
    const index = document.getElementById('gallery-index');
    if (!shell || !track || !total || !index) return;
    if (!currentGallery.length) {
        shell.style.display = 'none';
        track.innerHTML = '';
        total.textContent = '0';
        index.textContent = '1';
        return;
    }
    shell.style.display = '';
    total.textContent = String(currentGallery.length);
    index.textContent = '1';
    track.innerHTML = currentGallery.map(img => `
      <div class="slide">
        <img src="${img.photo}" alt="">
        ${img.caption ? `<div class="slide-caption">${img.caption}</div>` : ''}
      </div>
    `).join('');
    track.scrollLeft = 0;
    track.onscroll = () => {
      if (!track.clientWidth) return;
      index.textContent = String(Math.round(track.scrollLeft / track.clientWidth) + 1);
    };
}
function moveGallery(direction) {
    const track = document.getElementById('gallery-track');
    if (!track) return;
    track.scrollBy({ left: track.clientWidth * direction, behavior: 'smooth' });
    setTimeout(() => {
      const index = document.getElementById('gallery-index');
      if (!index || !track.clientWidth) return;
      index.textContent = String(Math.round(track.scrollLeft / track.clientWidth) + 1);
    }, 250);
}
function closeSheet() {
    document.getElementById('overlay').classList.remove('open');
    document.getElementById('sheet').classList.remove('open');
}
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    const registrations = await navigator.serviceWorker.getRegistrations();
    await Promise.all(registrations.map(registration => registration.unregister()));
  });
}
</script>
</body>
</html>
