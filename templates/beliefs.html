{% extends "base.html" %}
{% block title %}Our Beliefs{% endblock %}
{% block head %}<style>.belief-dot{width:8px;height:8px;border-radius:50%;background:var(--orange);flex-shrink:0;}.belief-label{font-size:0.88rem;font-weight:600;}.sheet-hi{padding:0 22px 18px;border-bottom:0.5px solid var(--line);}.sheet-tag{font-size:0.62rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--orange);font-weight:600;margin-bottom:4px;}.sheet-nm{font-family:'DM Serif Display',serif;font-size:1.5rem;}.sheet-bd{padding:20px 22px 0;font-size:0.9rem;line-height:1.75;color:var(--text2);}.scr-box{background:var(--teal-light);border-left:3px solid var(--teal);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:12px 14px;margin-top:20px;font-size:0.78rem;color:var(--teal);font-weight:500;}</style>{% endblock %}
{% block content %}
<div class="hero"><a href="{{ url_for('hub') }}" class="back-btn"><i class="bi bi-arrow-left"></i></a><div class="hero-content indent"><div class="hero-tag">Oasis Christian Centre</div><div class="hero-title">Our Beliefs</div></div></div>
<div class="body" style="display:flex;flex-direction:column;gap:10px;">
  {% for b in beliefs %}<button class="list-row" onclick="openB({{ loop.index0 }})"><div class="list-row-left"><div class="belief-dot"></div><div class="belief-label">{{ b.title }}</div></div><i class="bi bi-chevron-right row-chevron"></i></button>{% endfor %}
</div>
{% endblock %}
{% block modals %}
<div class="overlay" id="overlay" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"><button class="sheet-close" onclick="closeSheet()"><i class="bi bi-x"></i></button><div class="sheet-handle"></div><div class="sheet-hi"><div class="sheet-tag">Beliefs</div><div class="sheet-nm" id="sn"></div></div><div class="sheet-bd" id="sb"></div></div>
{% endblock %}
{% block scripts %}<script>
var bdata=[{% for b in beliefs %}{t:{{ b.title|tojson }},b:{{ (b.body or '')|tojson }},r:{{ (b.scripture or '')|tojson }}}{% if not loop.last %},{% endif %}{% endfor %}];
function openB(i){var d=bdata[i];document.getElementById('sn').textContent=d.t;document.getElementById('sb').innerHTML=d.b.split('\n\n').map(function(p){return'<p style="margin-bottom:14px">'+p+'</p>';}).join('')+(d.r?'<div class="scr-box">'+d.r+'</div>':''  );openSheet();}
</script>{% endblock %}
