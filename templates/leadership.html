{% extends "base.html" %}
{% block title %}Leadership{% endblock %}
{% block head %}<style>.pg{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:20px 16px;}.pc{background:var(--card);border-radius:var(--radius-lg);padding:22px 14px 18px;text-align:center;cursor:pointer;border:0.5px solid rgba(0,0,0,0.04);box-shadow:var(--shadow-sm);transition:transform 0.18s;width:100%;}.pc:active{transform:scale(0.97);}.pn{font-size:0.84rem;font-weight:700;margin-bottom:3px;}.pr{font-size:0.71rem;color:var(--orange);font-weight:600;}.sci{padding:0 24px;text-align:center;}.sal{width:100px;height:100px;border-radius:50%;overflow:hidden;margin:0 auto 16px;border:3px solid rgba(19,103,122,0.15);background:var(--bg);}.sal img{width:100%;height:100%;object-fit:cover;}.sap{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:2.4rem;color:var(--teal);}.spn{font-family:'DM Serif Display',serif;font-size:1.4rem;margin-bottom:4px;}.spr{font-size:0.75rem;color:var(--orange);font-weight:600;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:20px;}.spd{height:0.5px;background:var(--line);margin-bottom:18px;}.spb{font-size:0.9rem;color:var(--text2);line-height:1.75;text-align:left;}</style>{% endblock %}
{% block content %}
<div class="hero"><a href="{{ url_for('hub') }}" class="back-btn"><i class="bi bi-arrow-left"></i></a><div class="hero-content indent"><div class="hero-tag">Oasis Christian Centre</div><div class="hero-title">Leadership</div></div></div>
<div class="pg">{% for l in leaders %}<button class="pc" onclick="oL({{ loop.index0 }})"><div class="avatar" style="margin:0 auto 14px">{% if l.photo %}<img src="/static/{{ l.photo }}" alt="{{ l.name }}">{% else %}<div class="avatar-placeholder"><i class="bi bi-person"></i></div>{% endif %}</div><div class="pn">{{ l.name }}</div><div class="pr">{{ l.role }}</div></button>{% endfor %}</div>
{% endblock %}
{% block modals %}
<div class="overlay" id="overlay" onclick="cL()"></div>
<div class="sheet" id="sheet"><button class="sheet-close" onclick="cL()"><i class="bi bi-x"></i></button><div class="sheet-handle"></div><div class="sci"><div class="sal" id="saw"></div><div class="spn" id="sn"></div><div class="spr" id="sr"></div><div class="spd"></div><div class="spb" id="sb"></div></div></div>
{% endblock %}
{% block scripts %}<script>
var ld=[{% for l in leaders %}{n:{{ l.name|tojson }},r:{{ l.role|tojson }},b:{{ (l.bio or '')|tojson }},p:{{ ('/static/'~l.photo if l.photo else '')|tojson }}}{% if not loop.last %},{% endif %}{% endfor %}];
function oL(i){var l=ld[i];document.getElementById('sn').textContent=l.n;document.getElementById('sr').textContent=l.r;document.getElementById('sb').textContent=l.b||'No bio available.';var w=document.getElementById('saw');w.innerHTML=l.p?'<img src="'+l.p+'" style="width:100%;height:100%;object-fit:cover;">':'<div class="sap"><i class="bi bi-person"></i></div>';openSheet();}
function cL(){closeSheet();}
</script>{% endblock %}
