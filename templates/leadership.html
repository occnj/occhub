<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="{{ site_settings.get('theme_primary', '#13677A') }}">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Oasis Hub">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js')})}</script>
<script defer src="/static/reveal.js?v=3"></script>
<link rel="stylesheet" href="/static/transitions.css?v=1">
<link rel="stylesheet" href="/static/responsive.css?v=1">
    <title>Leadership — Oasis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="icon" type="image/png" href="/static/icon-192x192.png">
    <style>
        :root { --teal: {{ site_settings.get('theme_primary', '#13677A') }}; --orange: {{ site_settings.get('theme_accent', '#F2541B') }}; --bg: {{ site_settings.get('theme_background', '#F5F5F7') }}; --card: {{ site_settings.get('theme_card', '#ffffff') }}; --text: {{ site_settings.get('theme_text', '#1d1d1f') }}; --sub: {{ site_settings.get('theme_subtext', '#6e6e73') }}; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); {% if site_settings.get('ui_background_image') %}background-image: url('/static/{{ site_settings.get('ui_background_image') }}'); background-size: cover; background-position: center; background-attachment: fixed;{% endif %} font-family: 'DM Sans', sans-serif; color: var(--text); display: flex; justify-content: center; min-height: 100vh; padding-bottom: 40px; }
        .shell { width: 100%; max-width: 390px; }

        .hero { background: linear-gradient(150deg,#0f4250 0%,#13677A 55%,#f05123 100%); padding: 56px 24px 28px; position: relative; overflow:hidden; border-radius: 28px; margin: 16px 16px 0; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .hero::after { content:""; position:absolute; inset:auto -40px -60px auto; width:200px; height:200px; border-radius:50%; background:rgba(255,255,255,0.08); filter:blur(2px); pointer-events:none; }
        .back-btn { position: absolute; top: 56px; left: 20px; color: #fff; font-size: 1rem; text-decoration: none; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; background: #f05123; border-radius: 12px; box-shadow: 0 10px 24px rgba(240,81,35,0.28); z-index:2; }
        .hero-content { position: relative; z-index: 1; padding-left: 58px; }
        .hero-tag { font-size: 0.65rem; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.5); margin-bottom: 6px; }
        .hero-title { font-family: 'DM Serif Display', serif; font-size: 2rem; color: white; }
        .hero-copy { font-size: 0.9rem; line-height: 1.65; color: rgba(255,255,255,0.78); max-width: 250px; margin-top: 10px; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 18px 16px 24px; }

        .leader-card {
            background: var(--card); border-radius: 20px; padding: 22px 16px 18px;
            text-align: center; cursor: pointer; border: none;
            box-shadow: 0 1px 5px rgba(0,0,0,0.06); transition: transform 0.18s; width: 100%;
        }
        .leader-card:active { transform: scale(0.97); }

        .avatar { width: 90px; height: 90px; border-radius: 50%; overflow: hidden; margin: 0 auto 14px; background: var(--bg); border: 3px solid rgba(19,103,122,0.15); }
        .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .avatar-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: var(--teal); background: rgba(19,103,122,0.08); }
        .leader-name { font-size: 0.85rem; font-weight: 700; color: var(--text); margin-bottom: 3px; }
        .leader-role { font-size: 0.72rem; color: var(--orange); font-weight: 500; }

        /* Bottom sheet */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .overlay.open { opacity: 1; pointer-events: all; }

        .sheet {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%,-50%) scale(0.92);
            width: calc(100% - 40px); max-width: 380px;
            background: var(--card); border-radius: 24px;
            z-index: 101; padding: 28px 0 28px;
            max-height: 80vh; overflow-y: auto;
            opacity: 0; pointer-events: none;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
            box-shadow: 0 24px 60px rgba(0,0,0,0.28);
        }
        .sheet.open { transform: translate(-50%,-50%) scale(1); opacity: 1; pointer-events: all; }

        .sheet-content { padding: 0 24px; text-align: center; }
        .sheet-avatar { width: 100px; height: 100px; border-radius: 50%; overflow: hidden; margin: 0 auto 16px; border: 3px solid rgba(19,103,122,0.2); background: var(--bg); }
        .sheet-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .sheet-avatar-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; color: var(--teal); background: rgba(19,103,122,0.08); border-radius: 50%; }
        .sheet-name { font-family: 'DM Serif Display', serif; font-size: 1.4rem; color: var(--text); margin-bottom: 4px; }
        .sheet-role { font-size: 0.78rem; color: var(--orange); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 18px; }
        .sheet-divider { height: 1px; background: #f0f0f5; margin-bottom: 18px; }
        .sheet-bio { font-size: 0.9rem; color: #3a3a3c; line-height: 1.75; text-align: left; }
        .sheet-bio p { margin: 0 0 12px; }
        .sheet-bio p:last-child { margin-bottom: 0; }

        .sheet-close { position: absolute; top: 14px; right: 18px; background: #f0f0f5; border: none; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.8rem; color: var(--sub); }
    </style>
</head>
<body>
<div class="shell">
    <div class="hero">
        <a href="{{ url_for('hub') }}" class="back-btn"><i class="bi bi-arrow-left"></i></a>
        <div class="hero-content">
            <div class="hero-tag">Oasis Christian Centre</div>
            <div class="hero-title">Leadership</div>
            <div class="hero-copy">{{ settings.get('leadership_page_description') or 'Meet the pastors and leaders helping guide the vision of Oasis.' }}</div>
        </div>
    </div>

    <div class="grid">
        {% for l in leaders %}
        <button class="leader-card" onclick="openLeader({{ loop.index0 }})">
            <div class="avatar">
                {% if l.photo %}
                <img src="/static/{{ l.photo }}" alt="{{ l.name }}" loading="lazy">
                {% else %}
                <div class="avatar-placeholder"><i class="bi bi-person"></i></div>
                {% endif %}
            </div>
            <div class="leader-name">{{ l.name }}</div>
            <div class="leader-role">{{ l.role }}</div>
        </button>
        {% endfor %}
    </div>
</div>

<!-- Overlay -->
<div class="overlay" id="overlay" onclick="closeLeader()"></div>

<!-- Sheet -->
<div class="sheet" id="sheet">
    <button class="sheet-close" onclick="closeLeader()"><i class="bi bi-x"></i></button>
    <div class="sheet-content">
        <div class="sheet-avatar" id="sheet-avatar-wrap">
            <img id="sheet-img" src="" alt="">
        </div>
        <div class="sheet-name" id="sheet-name"></div>
        <div class="sheet-role" id="sheet-role"></div>
        <div class="sheet-divider"></div>
        <div class="sheet-bio" id="sheet-bio"></div>
    </div>
</div>

<!-- Embed leader data safely via Jinja into a script tag -->
<script>
const LEADERS = {{ leaders | map(attribute='name') | list | tojson }};
</script>

<script>
// Build full data from hidden elements to avoid Jinja/JS escaping issues
const leaderData = [
    {% for l in leaders %}
    {
        name: {{ l.name | tojson }},
        role: {{ l.role | tojson }},
        bio:  {{ (l.bio or '') | tojson }},
        photo: {{ ('/static/' ~ l.photo if l.photo else '') | tojson }}
    }{% if not loop.last %},{% endif %}
    {% endfor %}
];

function bioToHtml(text) {
    if (!text || !text.trim()) return '<p>No bio available.</p>';
    return text.split(/\n+/).filter(p => p.trim()).map(p =>
        '<p>' + p.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</p>'
    ).join('');
}

function openLeader(i) {
    const l = leaderData[i];

    // Name & role
    document.getElementById('sheet-name').textContent = l.name;
    document.getElementById('sheet-role').textContent = l.role;
    document.getElementById('sheet-bio').innerHTML = bioToHtml(l.bio);

    // Avatar
    const wrap = document.getElementById('sheet-avatar-wrap');
    if (l.photo) {
        wrap.innerHTML = '<img src="' + l.photo + '" alt="' + l.name + '" style="width:100%;height:100%;object-fit:cover;display:block;">';
    } else {
        wrap.innerHTML = '<div class="sheet-avatar-placeholder"><i class="bi bi-person"></i></div>';
    }

    document.getElementById('overlay').classList.add('open');
    document.getElementById('sheet').classList.add('open');
}

function closeLeader() {
    document.getElementById('overlay').classList.remove('open');
    document.getElementById('sheet').classList.remove('open');
}
</script>
{% include '_primary_cta.html' %}
</body>
</html>
