<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="{{ site_settings.get('theme_primary', '#13677A') }}">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Oasis Hub">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js')})}</script>
<script defer src="/static/reveal.js?v=3"></script>
<link rel="stylesheet" href="/static/transitions.css?v=1">
    <title>Ministries — Oasis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="icon" type="image/png" href="/static/icon-192x192.png">
    <style>
        :root { --teal: {{ site_settings.get('theme_primary', '#13677A') }}; --orange: {{ site_settings.get('theme_accent', '#F2541B') }}; --bg: {{ site_settings.get('theme_background', '#F5F5F7') }}; --card: {{ site_settings.get('theme_card', '#ffffff') }}; --text: {{ site_settings.get('theme_text', '#1d1d1f') }}; --sub: {{ site_settings.get('theme_subtext', '#6e6e73') }}; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); {% if site_settings.get('ui_background_image') %}background-image: url('/static/{{ site_settings.get('ui_background_image') }}'); background-size: cover; background-position: center; background-attachment: fixed;{% endif %} font-family: 'DM Sans', sans-serif; color: var(--text); display: flex; justify-content: center; min-height: 100vh; padding-bottom: 40px; }
        .shell { width: 100%; max-width: 390px; }

        .hero { background: linear-gradient(150deg,#0f4250 0%,#13677A 55%,#f05123 100%); padding: 56px 24px 28px; position: relative; overflow:hidden; border-radius:28px;margin:16px 16px 0;box-shadow:0 10px 30px rgba(0,0,0,0.08);}
        .hero::after { content:""; position:absolute; inset:auto -40px -60px auto; width:200px; height:200px; border-radius:50%; background:rgba(255,255,255,0.08); filter:blur(2px); pointer-events:none; }
        .back-btn { position: absolute; top: 56px; left: 20px; color: #fff; font-size: 1rem; text-decoration: none; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; background: #f05123; border-radius: 12px; box-shadow: 0 10px 24px rgba(240,81,35,0.28); z-index:2; }
        .hero-content { position: relative; z-index: 1; padding-left: 58px; }
        .hero-tag { font-size: 0.65rem; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.5); margin-bottom: 6px; }
        .hero-title { font-family: 'DM Serif Display', serif; font-size: 2rem; color: white; }
        .hero-copy { font-size: 0.9rem; line-height: 1.65; color: rgba(255,255,255,0.78); max-width: 250px; margin-top: 10px; }

        .list { padding: 20px 16px; display: flex; flex-direction: column; gap: 10px; }

        .row {
            background: var(--card); border-radius: 16px; padding: 18px 16px;
            display: flex; align-items: center; justify-content: space-between;
            cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            transition: transform 0.15s; border: none; width: 100%; text-align: left;
        }
        .row:active { transform: scale(0.98); }
        .row-left { display: flex; align-items: center; gap: 14px; }
        .row-icon {
            width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 1rem; background: rgba(19,103,122,0.08); color: var(--teal);
        }
        .row-icon.alt { background: rgba(242,84,27,0.08); color: var(--orange); }
        .row-label { font-size: 0.88rem; font-weight: 600; color: var(--text); }
        .row-chevron { color: #c7c7cc; font-size: 0.75rem; }

        /* Bottom sheet */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .overlay.open { opacity: 1; pointer-events: all; }
        .sheet { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%) scale(0.92); width: calc(100% - 40px); max-width: 380px; background: var(--card); border-radius: 24px; z-index: 101; padding: 0 0 28px; max-height: 80vh; overflow-y: auto; opacity: 0; pointer-events: none; transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease; box-shadow: 0 24px 60px rgba(0,0,0,0.28); }
        .sheet.open { transform: translate(-50%,-50%) scale(1); opacity: 1; pointer-events: all; }
        .sheet-header { padding: 26px 22px 16px; border-bottom: 1px solid #f0f0f5; }
        .sheet-tag { font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--orange); font-weight: 600; margin-bottom: 4px; }
        .sheet-name { font-family: 'DM Serif Display', serif; font-size: 1.5rem; color: var(--text); }
        .sheet-body { padding: 20px 22px 0; font-size: 0.9rem; line-height: 1.75; color: #3a3a3c; }
        .sheet-link {
            display: inline-flex; align-items: center; gap: 6px;
            margin-top: 20px; background: var(--teal); color: white;
            padding: 12px 20px; border-radius: 12px; text-decoration: none;
            font-size: 0.84rem; font-weight: 600; transition: opacity 0.15s;
        }
        .sheet-link:active { opacity: 0.85; }
        .sheet-close { position: absolute; top: 14px; right: 18px; background: #f0f0f5; border: none; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.8rem; color: var(--sub); }
    </style>
</head>
<body>
<div class="shell">
    <div class="hero">
        <a href="{{ url_for('hub') }}" class="back-btn"><i class="bi bi-arrow-left"></i></a>
        <div class="hero-content">
            <div class="hero-tag">Oasis Christian Centre</div>
            <div class="hero-title">Ministries</div>
            <div class="hero-copy">{{ settings.get('ministries_page_description') or 'Explore the ministries where people of every age can belong, grow, and serve.' }}</div>
        </div>
    </div>

    <div class="list">
        {% for m in ministries %}
        <button class="row" onclick="openSheet({{ loop.index0 }})">
            <div class="row-left">
                {% if m.photo %}
                <img src="/static/{{ m.photo }}" alt="{{ m.name }}" class="row-icon" style="object-fit:cover;border-radius:10px;" loading="lazy">
                {% else %}
                <div class="row-icon {% if loop.index is even %}alt{% endif %}">
                    <i class="bi {{ m.icon }}"></i>
                </div>
                {% endif %}
                <div class="row-label">{{ m.name }}</div>
            </div>
            <i class="bi bi-chevron-right row-chevron"></i>
        </button>
        {% endfor %}
    </div>
</div>

<div class="overlay" id="overlay" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
    <button class="sheet-close" onclick="closeSheet()"><i class="bi bi-x"></i></button>
    <div class="sheet-header">
        <div class="sheet-tag">Ministry</div>
        <div class="sheet-name" id="sheet-name"></div>
    </div>
    <div class="sheet-body">
        <div id="sheet-desc"></div>
        <a id="sheet-link" href="#" target="_blank" class="sheet-link">
            Learn More <i class="bi bi-arrow-up-right"></i>
        </a>
    </div>
</div>

<script>
const ministries = [
    {% for m in ministries %}
    { name: {{ m.name|tojson }}, desc: {{ (m.description or '')|tojson }}, url: {{ (m.url or '#')|tojson }} }{% if not loop.last %},{% endif %}
    {% endfor %}
];
function openSheet(i) {
    const m = ministries[i];
    document.getElementById('sheet-name').textContent = m.name;
    document.getElementById('sheet-desc').textContent = m.desc;
    const link = document.getElementById('sheet-link');
    link.href = m.url || '#';
    link.style.display = m.url ? 'inline-flex' : 'none';
    document.getElementById('overlay').classList.add('open');
    document.getElementById('sheet').classList.add('open');
}
function closeSheet() {
    document.getElementById('overlay').classList.remove('open');
    document.getElementById('sheet').classList.remove('open');
}
</script>
{% include '_primary_cta.html' %}
</body>
</html>
