{% extends "base.html" %}
{% block title %}Ministries{% endblock %}
{% block head %}<style>.shi{padding:0 22px 18px;border-bottom:0.5px solid var(--line);}.stg{font-size:0.62rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--orange);font-weight:600;margin-bottom:4px;}.snm{font-family:'DM Serif Display',serif;font-size:1.5rem;color:var(--text);}.sbd{padding:20px 22px 0;font-size:0.9rem;line-height:1.75;color:var(--text2);}.slb{display:inline-flex;align-items:center;gap:6px;margin-top:20px;background:var(--teal);color:#fff;padding:12px 20px;border-radius:var(--radius-sm);text-decoration:none;font-size:0.84rem;font-weight:600;}</style>{% endblock %}
{% block content %}
<div class="hero"><a href="{{ url_for('hub') }}" class="back-btn"><i class="bi bi-arrow-left"></i></a><div class="hero-content indent"><div class="hero-tag">Oasis Christian Centre</div><div class="hero-title">Ministries</div></div></div>
<div class="body" style="display:flex;flex-direction:column;gap:10px;">{% for m in ministries %}<button class="list-row" onclick="oMin({{ loop.index0 }})"><div class="list-row-left"><div class="icon-pill {% if loop.index is even %}orange{% else %}teal{% endif %}"><i class="bi {{ m.icon }}"></i></div><div style="font-size:0.88rem;font-weight:600">{{ m.name }}</div></div><i class="bi bi-chevron-right row-chevron"></i></button>{% endfor %}</div>
{% endblock %}
{% block modals %}<div class="overlay" id="overlay" onclick="closeSheet()"></div><div class="sheet" id="sheet"><button class="sheet-close" onclick="closeSheet()"><i class="bi bi-x"></i></button><div class="sheet-handle"></div><div class="shi"><div class="stg">Ministry</div><div class="snm" id="sn"></div></div><div class="sbd"><div id="sd"></div><a id="sl" href="#" target="_blank" class="slb">Learn More <i class="bi bi-arrow-up-right"></i></a></div></div>{% endblock %}
{% block scripts %}<script>
var mins=[{% for m in ministries %}{n:{{ m.name|tojson }},d:{{ (m.description or '')|tojson }},u:{{ (m.url or '#')|tojson }}}{% if not loop.last %},{% endif %}{% endfor %}];
function oMin(i){var m=mins[i];document.getElementById('sn').textContent=m.n;document.getElementById('sd').textContent=m.d;var l=document.getElementById('sl');l.href=m.u||'#';l.style.display=m.u?'inline-flex':'none';openSheet();}
</script>{% endblock %}
