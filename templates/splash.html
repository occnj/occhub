<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oasis Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background: {{ site_settings.get('theme_text', '#0a0a0a') }};
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'DM Sans', sans-serif;
        }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            animation: drift 8s ease-in-out infinite alternate;
        }
        .orb1 { width: 400px; height: 400px; background: color-mix(in srgb, {{ site_settings.get('theme_primary', '#13677A') }} 40%, transparent); top: -100px; right: -100px; }
        .orb2 { width: 300px; height: 300px; background: color-mix(in srgb, {{ site_settings.get('theme_accent', '#F2541B') }} 30%, transparent); bottom: -80px; left: -80px; animation-delay: -3s; }
        .orb3 { width: 200px; height: 200px; background: color-mix(in srgb, {{ site_settings.get('theme_primary', '#13677A') }} 20%, transparent); top: 50%; left: 50%; transform: translate(-50%,-50%); animation-delay: -5s; }
        @keyframes drift {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(20px, -20px) scale(1.05); }
        }
        .center {
            position: relative;
            z-index: 10;
            text-align: center;
            animation: fadeIn 0.8s ease forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .logo {
            width: 90px;
            height: 90px;
            object-fit: contain;
            filter: brightness(0) invert(1);
            margin-bottom: 20px;
        }
        .wordmark {
            color: rgba(255,255,255,0.85);
            font-size: 0.7rem;
            letter-spacing: 0.35em;
            font-weight: 500;
            text-transform: uppercase;
        }
        .bar-container {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 3px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, {{ site_settings.get('theme_primary', '#13677A') }}, {{ site_settings.get('theme_accent', '#F2541B') }});
            border-radius: 3px;
            animation: load 1.8s ease forwards;
        }
        @keyframes load {
            0% { width: 0%; }
            100% { width: 100%; }
        }
    </style>
    <link rel="icon" type="image/png" href="/static/icon-192x192.png">
    <script>
        setTimeout(function(){ window.location.href = "/gate"; }, 2200);
    </script>
</head>
<body>
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
    <div class="center">
        <img src="/static/{{ site_settings.get('logo_path') or 'logo.png' }}" class="logo" alt="Oasis">
        <div class="wordmark">Oasis Hub</div>
    </div>
    <div class="bar-container">
        <div class="bar-fill"></div>
    </div>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    const registrations = await navigator.serviceWorker.getRegistrations();
    await Promise.all(registrations.map(registration => registration.unregister()));
  });
}
</script>
</body>
</html>
