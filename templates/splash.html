<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Oasis Hub</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/static/icon-192x192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#08111a;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden;font-family:'DM Sans',sans-serif;}
.orb{position:absolute;border-radius:50%;pointer-events:none;}
.orb1{width:420px;height:420px;top:-120px;right:-100px;background:radial-gradient(circle,rgba(19,103,122,0.28) 0%,transparent 70%);animation:drift 9s ease-in-out infinite alternate;}
.orb2{width:320px;height:320px;bottom:-100px;left:-80px;background:radial-gradient(circle,rgba(242,84,27,0.22) 0%,transparent 70%);animation:drift 7s ease-in-out infinite alternate-reverse;}
@keyframes drift{from{transform:translate(0,0);}to{transform:translate(18px,-18px);}}
.center{position:relative;z-index:10;text-align:center;animation:fadeUp 0.7s ease forwards;}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.logo{width:84px;height:84px;filter:brightness(0) invert(1);margin:0 auto 18px;display:block;}
.wordmark{color:rgba(255,255,255,0.5);font-size:0.68rem;letter-spacing:0.38em;text-transform:uppercase;}
.bar-wrap{position:absolute;bottom:52px;left:50%;transform:translateX(-50%);width:100px;height:2px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden;}
.bar-fill{height:100%;width:0%;background:linear-gradient(90deg,#13677A,#F2541B);animation:load 1.9s ease forwards;}
@keyframes load{to{width:100%;}}
</style>
<script>setTimeout(function(){window.location.href="/gate";},2300);</script>
</head>
<body>
<div class="orb orb1"></div><div class="orb orb2"></div>
<div class="center"><img src="/static/logo.png" class="logo" alt="Oasis"><div class="wordmark">Oasis Hub</div></div>
<div class="bar-wrap"><div class="bar-fill"></div></div>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(sw){sw.unregister();});});</script>
</body></html>
